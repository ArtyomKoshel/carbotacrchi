[project]
name = "carbot-collector"
version = "0.1.0"
description = "CarBot collector: fetches car listings from auction platforms and hands CarLot v1 records to the core"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.130",
    "jsonschema>=4.23",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-jsonschema>=4.26.0.20261006",
]
# The old parser's runtime deps, only for parity tests that import it side by side.
# Removed with parser/ in refactor stage 7.
legacy = [
    "pymysql>=1.1,<2.0",
    "apscheduler>=3.10,<4.0",
    "python-dotenv>=1.0,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "redis>=5.0,<6.0",
    "rq>=1.16,<2.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.uv]
default-groups = ["dev", "legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=collector --cov-report=term-missing --cov-fail-under=90"
markers = [
    "live: calls a real external API; skipped unless selected with -m live",
    "legacy: compares with the old parser in ../parser (removed in refactor stage 7)",
]

[tool.coverage.run]
branch = true
source = ["collector"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "TID", "N", "S", "C4", "PIE", "RET"]
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLC0415"]
# Field-by-field API mappers moved from the old parser: long by nature, flat, covered by golden tests.
"src/collector/adapters/*/mapping.py" = ["PLR0912", "PLR0913", "PLR0915"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
