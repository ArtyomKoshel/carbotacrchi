[project]
name = "carbot-collector"
version = "0.1.0"
description = "CarBot collector: fetches car listings from auction platforms and hands CarLot v1 records to the core"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.130",
    "jsonschema>=4.23",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=collector --cov-report=term-missing --cov-fail-under=90"
markers = ["live: calls a real external API; skipped unless selected with -m live"]

[tool.coverage.run]
branch = true
source = ["collector"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT", "TID", "N", "S", "C4", "PIE", "RET"]
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
