name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Laravel (PHPUnit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: laravel
    services:
      mysql:
        image: mysql:9.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: carbot_test
          MYSQL_USER: carbot
          MYSQL_PASSWORD: carbot
        # phpunit.xml pins the test database to 127.0.0.1:3318
        ports: ["3318:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, zip, pdo_mysql, bcmath
          coverage: none
      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('laravel/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        run: vendor/bin/phpunit

  parser:
    name: Parser (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: parser/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest

  collector:
    name: Collector (ruff, mypy, pytest, contracts)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: collector
    services:
      mysql:
        image: mysql:9.1
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: collector_test
          MYSQL_USER: carbot
          MYSQL_PASSWORD: carbot
        ports: ["3318:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      COLLECTOR_TEST_DB_URL: mysql+aiomysql://carbot:carbot@127.0.0.1:3318/collector_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Contract schema is current
        run: uv run python -m collector.contracts check
      - run: uv run pytest
      - name: Image builds
        run: docker build -q -t carbot-collector:ci .
