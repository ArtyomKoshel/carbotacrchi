[pytest]
testpaths = tests
# Live checks call the real Encar API (geo-blocked outside Korea); run them
# explicitly with `-m live`. Scripts that hit the network at import time are
# not tests and are ignored.
addopts = -m "not live" --ignore=tests/test_threading.py --ignore=tests/encar_field_audit.py -p no:cacheprovider
markers =
    live: calls a real external API; skipped unless selected with -m live
