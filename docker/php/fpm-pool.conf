; PHP-FPM settings of the official php:*-fpm image (docker.conf, zz-docker.conf),
; for Alpine's php84-fpm package: same user, port, logs and environment.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
; Railway variables reach the workers (Alpine's default clears them).
clear_env = no
access.log = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
