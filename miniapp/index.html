<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>CarBot — подбор авто из Кореи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <!-- option icons (js/lot.js OPTION_ICONS): only these glyphs; the list must stay alphabetical -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=360,add_road,air,airline_seat_recline_extra,airline_seat_recline_normal,album,blinds,bluetooth,brightness_6,brightness_auto,cable,camera_rear,check,compress,directions_car,emoji_objects,event_seat,flip,gamepad,height,highlight,live_tv,local_fire_department,local_parking,lock,luggage,memory,navigation,open_with,radar,security,sensor_door,settings_remote,shield,spa,speed,swap_vert,thermostat,toll,trip_origin,tune,tv,unarchive,usb,visibility,visibility_off,vpn_key,water_drop,wb_shade,wb_sunny,wifi_tethering,window&display=block">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.min.css">
  <link rel="stylesheet" href="css/app.css?v=28">
</head>
<body>
<!--
  One page, two shells (docs: concept "CarBot: два интерфейса подборщика"):
  body.tg   — opened inside Telegram: Telegram's theme, BackButton, MainButton, SecondaryButton;
  body.web  — opened in a browser; body.wide adds the desktop work place (>= 900 px):
              filters on the left, results in the middle, the lot on the right.
  Views: search (results), favorites, compare, alerts. Overlays on narrow screens: filters, lot.
-->
<div id="boot" class="boot" aria-live="polite"><span class="spinner"></span><span>Загрузка…</span></div>

<div id="app">
  <header id="topbar" class="topbar">
    <a class="brand" href="#" data-nav="search">CarBot</a>
    <form id="ask-form" class="ask" role="search" autocomplete="off">
      <svg class="ask__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="ask-input" class="ask__input" type="search" enterkeyhint="search"
             placeholder="ИИ-поиск: Sonata до 20 млн без ДТП" aria-label="ИИ-поиск: опишите машину словами или вставьте ссылку Encar"
             aria-controls="ask-hints" aria-autocomplete="list">
      <span class="ask__ai" aria-hidden="true">ИИ</span>
      <kbd class="ask__kbd wide-only">/</kbd>
      <div class="ask__hints" id="ask-hints" role="listbox" hidden>
        <div class="ask__hints-title">Опишите машину своими словами — ИИ подберёт фильтры. Или вставьте ссылку Encar.</div>
        <button type="button" role="option" class="ask__hint">Hyundai Sonata 2020–2022, до 15 млн, без ДТП</button>
        <button type="button" role="option" class="ask__hint">Kia K5 не старше 2021 года, пробег до 60 000 км</button>
        <button type="button" role="option" class="ask__hint">Genesis G80 полный привод, один владелец</button>
      </div>
    </form>
    <nav class="topnav wide-only" aria-label="Разделы">
      <a href="#" data-nav="search" class="topnav__item">Поиск</a>
      <a href="#favorites" data-nav="favorites" class="topnav__item">Избранное <span class="count" id="fav-count"></span></a>
      <a href="#compare" data-nav="compare" class="topnav__item">Сравнение <span class="count" id="cmp-count"></span></a>
      <a href="#alerts" data-nav="alerts" class="topnav__item">Подписки <span class="count count--new" id="subs-badge"></span></a>
    </nav>
    <div id="account-slot" class="account-slot"></div>
  </header>

  <aside id="filters-pane" class="filters-pane" aria-label="Фильтры">
    <div class="pane-head">
      <span class="pane-head__title">Фильтры</span>
      <button class="link-btn" id="filters-reset-btn" type="button">Сбросить</button>
    </div>
    <div id="filters-container" class="filters"></div>
    <div class="pane-foot web-narrow-only">
      <button class="btn btn--primary btn--block" id="filters-apply-btn" type="button">Показать</button>
    </div>
  </aside>

  <main id="main" class="main">
    <!-- Search: applied filters, sorting, the results -->
    <section id="view-search" class="view" aria-label="Результаты поиска">
      <div class="toolbar">
        <div class="toolbar__row">
          <button class="chip chip--filters narrow-only" id="open-filters" type="button">Фильтры <span id="filters-count"></span></button>
          <span class="toolbar__count num" id="results-count"></span>
          <div class="chips" id="applied-chips"></div>
        </div>
        <div class="toolbar__row toolbar__row--end">
          <button class="chip chip--follow" id="subscribe-btn" type="button" hidden>Следить</button>
          <label class="sort">
            <span class="visually-hidden">Сортировка</span>
            <select id="sort-select" class="sort__select">
              <option value="date">Сначала новые</option>
              <option value="price_asc">Дешевле</option>
              <option value="price_desc">Дороже</option>
              <option value="mileage_asc">Меньше пробег</option>
              <option value="year_desc">Новее год</option>
              <option value="year_asc">Старше год</option>
              <option value="mileage_desc">Больше пробег</option>
            </select>
          </label>
          <button class="chip wide-only" id="columns-btn" type="button" aria-haspopup="dialog">Колонки</button>
          <div class="seg wide-only" role="group" aria-label="Вид">
            <button type="button" class="seg__btn" data-view="table" aria-pressed="true">Таблица</button>
            <button type="button" class="seg__btn" data-view="cards" aria-pressed="false">Карточки</button>
          </div>
        </div>
      </div>
      <div class="banner" id="results-banner" hidden></div>
      <div id="results" class="results"></div>
      <div id="results-more" class="results-more" hidden><span class="spinner"></span></div>
      <div id="scroll-sentinel" class="sentinel"></div>
    </section>

    <section id="view-favorites" class="view" hidden aria-label="Избранное">
      <h1 class="view__title">Избранное</h1>
      <div id="favorites" class="results"></div>
    </section>

    <section id="view-compare" class="view" hidden aria-label="Сравнение">
      <h1 class="view__title">Сравнение</h1>
      <div id="compare"></div>
    </section>

    <section id="view-alerts" class="view" hidden aria-label="Подписки">
      <h1 class="view__title">Подписки</h1>
      <p class="view__hint">Новые лоты по сохранённому поиску приходят в Telegram.</p>
      <div id="subs-list"></div>
    </section>
  </main>

  <aside id="lot-pane" class="lot-pane" aria-label="Лот" hidden>
    <div id="lot-view" class="lot"></div>
  </aside>

  <!-- Narrow screens without Telegram's own buttons: the screen's actions -->
  <div id="actionbar" class="actionbar" hidden></div>

  <nav id="tabbar" class="tabbar" aria-label="Разделы">
    <a href="#" data-nav="search" class="tabbar__item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Поиск</a>
    <a href="#favorites" data-nav="favorites" class="tabbar__item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>Избранное</a>
    <a href="#compare" data-nav="compare" class="tabbar__item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v18M16 3v18M3 8h5M16 16h5"/></svg>Сравнение<span class="dot-count" id="cmp-count-tab"></span></a>
    <a href="#alerts" data-nav="alerts" class="tabbar__item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Подписки<span class="dot-count" id="subs-badge-tab"></span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="js/telegram.js?v=28"></script>
<script src="js/browser-auth.js?v=28"></script>
<script src="js/api.js?v=28"></script>
<script src="js/taxonomy.js?v=28"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
<script src="js/format.js?v=28"></script>
<script src="js/catalog-filter.js?v=28"></script>
<script src="js/filters.js?v=28"></script>
<script src="js/compare.js?v=28"></script>
<script src="js/results.js?v=28"></script>
<script src="js/lot.js?v=28"></script>
<script src="js/subscriptions.js?v=28"></script>
<script src="js/app.js?v=28"></script>
</body>
</html>
